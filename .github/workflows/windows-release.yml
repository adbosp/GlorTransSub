name: Build Windows release

"on":
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated build to GitHub Releases
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_VERSION: '1.2.0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      HF_HUB_DISABLE_XET: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$env:RELEASE_VERSION") {
            throw 'The tag must match the version in the workflow and version_info.txt.'
          }
      - name: Install CPU PyTorch
        run: python scripts/ci_run.py cpu-pytorch -- python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0 torchvision==0.28.0
      - name: Install application, offline conversion and build dependencies
        run: python scripts/ci_run.py dependencies -- python -m pip install -r requirements.txt -r requirements-opus-build.txt -r requirements-speech.txt -r requirements-build.txt
      - name: Check dependencies
        run: python scripts/ci_run.py dependency-check -- python -m pip check
      - name: Run portable regression and conversion tests
        env:
          GLOSUB_TEST_CT2_CONVERSION: '1'
        run: python scripts/ci_run.py regression-tests -- python -m unittest discover -s tests -v
      - name: Prepare English to Vietnamese offline model
        run: python scripts/ci_run.py opus-model -- python prepare_opus_model.py --source en --target vi --output models/opus-en-vi
      - name: Download and verify English OCR models
        run: >-
          python scripts/ci_run.py ocr-model -- python -c "from pathlib import Path; import easyocr;
          Path('models/easyocr-user').mkdir(parents=True, exist_ok=True);
          easyocr.Reader(['en'], gpu=False, verbose=False,
          model_storage_directory='models/easyocr', user_network_directory='models/easyocr-user')"
      - name: Prepare local speech models
        run: python scripts/ci_run.py speech-models -- python prepare_speech_models.py --output models/speech --model tiny.en
      - name: Download licensed Whisper test recording
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force models/speech/test-audio | Out-Null
          Invoke-WebRequest https://raw.githubusercontent.com/openai/whisper/main/tests/jfk.flac -OutFile models/speech/test-audio/jfk.flac
      - name: Remove conversion-only dependencies before packaging
        run: python scripts/ci_run.py runtime-only -- python -m pip uninstall -y transformers safetensors
      - name: Check source Windows runtime and actual language models
        run: python scripts/ci_run.py source-smoke -- python release_checks.py --model-root models --report build/source-smoke.json
      - name: Build Windows application
        run: python scripts/ci_run.py pyinstaller -- python -m PyInstaller --noconfirm --clean GloSub.spec
      - name: Include language models and user instructions
        shell: pwsh
        run: |
          $app = "dist/GloSub-v$env:RELEASE_VERSION-Windows-x64"
          Copy-Item models "$app/models" -Recurse
          Copy-Item "RELEASE_NOTES_v$env:RELEASE_VERSION.md" "$app/README.txt"
          Copy-Item LICENSE "$app/LICENSE.txt"
          Copy-Item THIRD_PARTY_SPEECH.md "$app/THIRD_PARTY_SPEECH.md"
          python scripts/prepare_speech_notices.py "$app"
          if ($LASTEXITCODE -ne 0) { throw 'Speech source/license packaging failed.' }
      - name: Check the packaged executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/GloSub-v$env:RELEASE_VERSION-Windows-x64/GloSub.exe").Path
          $report = Join-Path $env:GITHUB_WORKSPACE 'build/packaged-smoke.json'
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test', '--report', "`"$report`"") -PassThru
          if (-not $process.WaitForExit(240000)) {
            $process.Kill()
            throw 'Packaged executable self-test timed out.'
          }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) {
            throw "Packaged executable self-test failed with exit code $($process.ExitCode)."
          }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.status -ne 'passed' -or -not $result.frozen) {
            Get-Content $report
            throw 'The actual frozen executable did not pass its checks.'
          }
          Get-Content $report
          Write-Output "::notice title=packaged-self-test::Frozen Windows executable passed OCR and offline translation checks."
      - name: Create ZIP and SHA-256 checksum
        shell: pwsh
        run: |
          $name = "GloSub-v$env:RELEASE_VERSION-Windows-x64"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip" -CompressionLevel Optimal
          if ((Get-Item "dist/$name.zip").Length -ge 2GB) {
            throw "ZIP exceeds the GitHub Release asset size limit."
          }
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - name: Surface build diagnostics
        if: failure()
        shell: pwsh
        run: |
          $logs = Get-ChildItem build/*.log -ErrorAction SilentlyContinue | Sort-Object LastWriteTime
          foreach ($log in ($logs | Select-Object -Last 1)) {
            $tail = (Get-Content $log.FullName -Tail 18) -join "`n"
            if ($tail.Length -gt 5000) { $tail = $tail.Substring($tail.Length - 5000) }
            $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=$($log.BaseName)::$escaped"
          }
          foreach ($report in Get-ChildItem build/*smoke.json -ErrorAction SilentlyContinue) {
            $text = Get-Content $report.FullName -Raw
            $escaped = $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=$($report.Name)::$escaped"
          }
      - name: Retain build output and validation reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ env.RELEASE_VERSION }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            dist/SHA256SUMS.txt
            build/*smoke.json
            build/*.log
            build/GloSub/warn-*.txt
      - name: Retain ZIP for build-only runs
        if: success() && !startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip-${{ env.RELEASE_VERSION }}
          retention-days: 1
          path: dist/*.zip
      - name: Publish validated GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $zip = "dist/GloSub-v$env:RELEASE_VERSION-Windows-x64.zip"
          $releaseArgs = @('release', 'create', $tag, $zip, 'dist/SHA256SUMS.txt', 'build/packaged-smoke.json',
            '--target', $env:GITHUB_SHA, '--title', "GloSub v$env:RELEASE_VERSION",
            '--notes-file', "RELEASE_NOTES_v$env:RELEASE_VERSION.md", '--draft')
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $releaseArgs += '--verify-tag' }
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release asset upload failed; no release was published.' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed; the uploaded draft is retained.' }
